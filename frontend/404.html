<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | MailGuard AI</title>
  <meta name="description" content="The requested page could not be found on MailGuard AI.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" href="/favicon.ico">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/theme-init.js"></script>
</head>
<body class="error-page-body">
  <div class="error-page-container">
    <div class="error-card card">
      <div class="card-maroon-header">
        <div class="card-header-icon" aria-hidden="true">🔍</div>
        <div>
          <h1 class="card-maroon-title">404 — Page Not Found</h1>
          <p class="card-maroon-sub">The endpoint or resource you requested does not exist.</p>
        </div>
      </div>
      <div class="card-body error-card-body">
        <div class="error-code-badge" aria-hidden="true">404</div>
        <h2 class="error-headline">Lost in Transmission</h2>
        <p class="error-description">
          The requested URL was not found on this server. If you entered a link manually, please verify the spelling or return to the application dashboard.
        </p>
        <div class="error-actions">
          <a href="/#/dashboard" class="btn btn-primary btn-crimson">Return to Dashboard →</a>
          <a href="/#/home" class="btn btn-outline">Go to Home</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
